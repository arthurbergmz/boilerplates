[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome_app"
version = "0.1.0"
description = "A uv-first Python project starter"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Your Name" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6.9,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
awesome-app = "awesome_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
